<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #121110;
    color: #ededec;
    font-family: "Inter", -apple-system, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 90px;
    position: relative;
  }
  .rule { position: absolute; left: 90px; right: 90px; height: 1px; background: rgba(255,255,255,0.1); }
  .rule.top { top: 70px; }
  .rule.bottom { bottom: 70px; }
  .kicker {
    font-family: "JetBrains Mono", monospace;
    color: #ff6600; font-size: 20px; letter-spacing: 0.18em; margin-bottom: 28px;
  }
  h1 { font-size: 72px; font-weight: 700; line-height: 1.08; letter-spacing: -0.02em; margin-bottom: 30px; }
  .sub { font-size: 26px; color: #a1a09a; max-width: 820px; line-height: 1.5; margin-bottom: 40px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 56px; height: 56px; border-radius: 10px; }
  .brand-name { font-weight: 700; font-size: 30px; letter-spacing: 0.14em; }
  .brand-tag { font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: 0.24em; color: #6e6d68; border-left: 1px solid rgba(255,255,255,0.16); padding-left: 16px; }
  .corner { position: absolute; top: 92px; right: 90px; font-family: "JetBrains Mono", monospace; font-size: 15px; color: #6e6d68; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="rule top"></div>
  <div class="corner">PDFs · REFERÊNCIAS · NOTAS · TEXTO</div>
  <h1>Toda a sua pesquisa.<br />Um só lugar.</h1>
  <p class="sub">Leitura, referências, anotações e manuscrito reunidos em uma única ferramenta. Menos tempo organizando, mais tempo pesquisando.</p>
  <div class="brand">
    <img src="icon.png" alt="" />
    <span class="brand-name">BLAKE</span>
    <span class="brand-tag">ACADEMIC IDE</span>
  </div>
  <div class="rule bottom"></div>
</body>
</html>
